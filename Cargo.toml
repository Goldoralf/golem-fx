# golem-fx — golem's in-house effects (VST3, Rust / nih-plug). See README.md.
[workspace]
resolver = "2"
members = ["gfx-dsp", "gfx-bench", "gfx-boost", "gfx-comp", "gfx-deesser", "gfx-eq", "gfx-gate", "gfx-limiter", "gfx-wah", "gfx-autowah", "gfx-tremolo", "gfx-vibrato", "gfx-chorus", "gfx-flanger", "gfx-phaser", "gfx-rotary", "gfx-drive", "gfx-delay", "gfx-reverb", "gfx-shimmer", "gfx-killswitch", "gfx-octaver", "gfx-pitch", "gfx-pitch-classic", "gfx-detune", "gfx-gapmeter", "gfx-met", "gfx-emet", "gfx-shem", "gfx-golem", "gfx-glitch", "gfx-geq", "gfx-freqshift", "gfx-ringmod", "xtask"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Raphaël Mucchielli", "Grégory Beurier", "golem contributors"]
publish = false

[workspace.dependencies]
# golem's fork (branch golem-fx), based on the revision ~/golem/plugins pins (de42101): adds output
# (read-only) parameters for meters and applies controller writes while processing.
nih_plug = { git = "https://github.com/Goldoralf/nih-plug.git", rev = "572f787d9ce7d5daf39642fea2f12f1aedffbcf8", features = ["assert_process_allocs"] }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
gfx-dsp = { path = "gfx-dsp" }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.test]
opt-level = 2

