# golem-fx — golem's in-house effects (VST3, Rust / nih-plug). See README.md.
[workspace]
resolver = "2"
members = ["gfx-dsp", "gfx-bench", "gfx-boost", "xtask"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Raphaël Mucchielli", "Grégory Beurier", "golem contributors"]
publish = false

[workspace.dependencies]
# Same pinned revision as ~/golem/plugins: one nih-plug for every golem plugin.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["assert_process_allocs"] }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
gfx-dsp = { path = "gfx-dsp" }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.test]
opt-level = 2
