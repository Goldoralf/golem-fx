[package]
name = "gfx-bench"
version = "0.1.0"
description = "Offline render and measurement tool of golem-fx"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
gfx-dsp.workspace = true
gfx-boost = { path = "../gfx-boost", default-features = false }
gfx-gate = { path = "../gfx-gate", default-features = false }
gfx-comp = { path = "../gfx-comp", default-features = false }
gfx-limiter = { path = "../gfx-limiter", default-features = false }
gfx-eq = { path = "../gfx-eq", default-features = false }
gfx-deesser = { path = "../gfx-deesser", default-features = false }
gfx-wah = { path = "../gfx-wah", default-features = false }
gfx-autowah = { path = "../gfx-autowah", default-features = false }
gfx-tremolo = { path = "../gfx-tremolo", default-features = false }
gfx-vibrato = { path = "../gfx-vibrato", default-features = false }
gfx-chorus = { path = "../gfx-chorus", default-features = false }
gfx-flanger = { path = "../gfx-flanger", default-features = false }
gfx-phaser = { path = "../gfx-phaser", default-features = false }
gfx-rotary = { path = "../gfx-rotary", default-features = false }
gfx-flanger-calf = { path = "../gfx-flanger-calf", default-features = false }
