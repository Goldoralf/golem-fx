[package]
name = "gfx-bench"
version = "0.1.0"
description = "Offline render and measurement tool of golem-fx"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
gfx-dsp.workspace = true
gfx-boost = { path = "../gfx-boost", default-features = false }
gfx-gate = { path = "../gfx-gate", default-features = false }
gfx-comp = { path = "../gfx-comp", default-features = false }
gfx-limiter = { path = "../gfx-limiter", default-features = false }
gfx-eq = { path = "../gfx-eq", default-features = false }
gfx-deesser = { path = "../gfx-deesser", default-features = false }
gfx-wah = { path = "../gfx-wah", default-features = false }
gfx-autowah = { path = "../gfx-autowah", default-features = false }
