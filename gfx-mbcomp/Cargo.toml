[package]
name = "gfx-mbcomp"
version = "0.1.0"
description = "GoleM FX MB Comp — golem's multiband compressor (block mb-comp)"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["plugin"]
# The nih-plug wrapper (VST3). gfx-bench builds the processor alone, with default-features = false.
plugin = ["dep:nih_plug"]

[dependencies]
gfx-dsp.workspace = true
gfx-comp = { path = "../gfx-comp", default-features = false }
nih_plug = { workspace = true, optional = true }

[dev-dependencies]
realfft = "3.5"
