[package]
name = "gfx-pitch-test"
version = "0.1.0"
description = "TEMPORARY: gfx-pitch reporting 0 latency, for golem-rack's REAPER stall A/B"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wrap"]
# The nih-plug wrapper (VST3). gfx-bench builds the processor alone, with default-features = false.
wrap = ["dep:nih_plug"]
# never enable: it only silences the check-cfg warning on the included gfx-pitch source (its own VST3
# export sits behind `plugin`, and two exports in one library would clash)
plugin = []

[dependencies]
gfx-dsp.workspace = true
nih_plug = { workspace = true, optional = true }
