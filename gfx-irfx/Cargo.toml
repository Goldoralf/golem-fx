[package]
name = "gfx-irfx"
version = "0.1.0"
description = "GoleM FX IR FX — golem's stereo IR effect: springs, echoes and reverb boxes as impulse responses"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["plugin"]
# The nih-plug wrapper (VST3). gfx-bench builds the processor alone, with default-features = false.
plugin = ["dep:nih_plug"]

[dependencies]
gfx-dsp = { workspace = true, features = ["ir-host"] }
nih_plug = { workspace = true, optional = true }

[dev-dependencies]
realfft = "3.5"
