[package]
name = "gfx-octafuzz"
version = "0.1.0"
description = "GoleM FX Octafuzz — golem's transformer octave fuzz, circuit-simulated over gfx-fuzz's engine"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["plugin"]
# The nih-plug wrapper (VST3). gfx-bench builds the processor alone, with default-features = false.
plugin = ["dep:nih_plug"]
# The editor a DAW opens (gfx-ui): --features gui, what `cargo xtask dist` builds. Off by default: golem plays the
# pedals without it (it has its own drawers) and its release must not link X11 and OpenGL.
gui = ["plugin", "dep:gfx-ui"]

[dependencies]
gfx-dsp.workspace = true
# the engine only: gfx-fuzz's own VST3 entry point must not be linked here
gfx-fuzz = { path = "../gfx-fuzz", default-features = false }
nih_plug = { workspace = true, optional = true }
gfx-ui = { workspace = true, optional = true }
