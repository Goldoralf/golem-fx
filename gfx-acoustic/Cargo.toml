[package]
name = "gfx-acoustic"
version = "0.1.0"
description = "GoleM FX Acoustic — golem's acoustic simulator: an electric's DI (or a piezo) to a miked acoustic guitar"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
include = ["src/**", "data/**", "NOTICE", "README.md", "Cargo.toml"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["plugin"]
# The nih-plug wrapper (VST3). gfx-bench builds the processor alone, with default-features = false.
plugin = ["dep:nih_plug"]

[dependencies]
gfx-dsp.workspace = true
gfx-comp = { path = "../gfx-comp", default-features = false }
nih_plug = { workspace = true, optional = true }
