[package]
name = "gfx-crusher"
version = "0.1.0"
description = "GoleM FX Crusher — golem's bitcrusher and sample-rate reducer: a virtual converter, rendered band-limited"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["plugin"]
# The nih-plug wrapper (VST3). gfx-bench builds the processor alone, with default-features = false.
plugin = ["dep:nih_plug"]

[dependencies]
gfx-dsp.workspace = true
num-complex = "0.4"
nih_plug = { workspace = true, optional = true }

[dev-dependencies]
realfft = "3.5"
