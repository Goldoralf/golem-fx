[package]
name = "gfx-morph"
version = "0.1.0"
description = "GoleM FX Morph — golem's live vocal mangler: guarded multiband dirt with A / B morph, modal objects, comp, filter and slap echo, zero latency"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["plugin"]
# The nih-plug wrapper (VST3). gfx-bench builds the processor alone, with default-features = false.
plugin = ["dep:nih_plug"]

[dependencies]
gfx-dsp.workspace = true
nih_plug = { workspace = true, optional = true }

[build-dependencies]
# the tables are measured through the plugin's own type code (src/types.rs) and gfx-dsp's kernels
gfx-dsp.workspace = true

[dev-dependencies]
realfft = "3.5"
